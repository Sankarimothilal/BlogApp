<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSphere - Password Reset</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
        BlogSphere
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
      </ul>
      <div>
        <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme"></button>
      </div>
    </div>
  </header>

  <!-- Password Reset Card (Matching User Screenshot 2) -->
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:440px;">
      
      <!-- Header with Info Icon matching Screenshot 2 -->
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
        <div style="width:26px; height:26px; border-radius:50%; background:#2563eb; display:flex; align-items:center; justify-content:center; color:#ffffff; font-weight:700; font-family:serif; font-size:15px; flex-shrink:0;">
          i
        </div>
        <h2 style="font-size:1.35rem; font-weight:700; margin:0; color:var(--text-main);">Password Reset</h2>
      </div>

      <p id="page-subtitle" style="font-size:0.92rem; color:var(--text-muted); line-height:1.5; margin-bottom:20px;">
        Forgot your password? Enter your email address, and we'll send you a verification code to reset it.
      </p>

      <div id="status-msg" style="display:none; padding:12px 14px; border-radius:8px; font-size:0.85rem; margin-bottom:16px;"></div>

      <!-- Step 1: Request Code (Exact match to screenshot 2) -->
      <form class="auth-form" id="step1-form" onsubmit="handleSendCode(event)">
        <div class="form-group" style="margin-bottom:22px;">
          <input type="email" id="email" placeholder="Email address" required autocomplete="email" style="width:100%; padding:12px 14px; font-size:0.95rem; border-radius:8px;">
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
          <a href="login.html" style="font-size:0.88rem; color:var(--text-muted); text-decoration:none;">&larr; Back to Login</a>
          <button type="submit" id="btn-continue" class="btn btn-primary" style="padding:10px 24px; border-radius:8px; font-weight:600; font-size:0.95rem;">Continue</button>
        </div>
      </form>

      <!-- Step 2: Verify the emailed code -->
      <form class="auth-form" id="step2-form" style="display:none;" onsubmit="handleVerifyCode(event)">
        <div class="form-group" style="margin-bottom:14px;">
          <label for="verification-code" style="font-size:0.85rem; font-weight:600;">Verification Code</label>
          <input type="text" id="verification-code" placeholder="Enter 6-digit code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required style="width:100%; padding:10px 14px; font-size:1rem; letter-spacing:3px; font-weight:600; text-align:center; border-radius:8px;">
        </div>
        <button type="submit" id="btn-verify-code" class="btn btn-primary" style="width:100%; padding:11px; font-size:0.95rem; font-weight:600; border-radius:8px; margin-bottom:14px;">Verify Code</button>
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
          <a href="javascript:void(0)" onclick="backToStep1()" style="color:var(--text-muted); text-decoration:none;">&larr; Change email</a>
          <button type="button" id="btn-resend-code" onclick="resendCode()" style="border:0; background:none; color:var(--primary); text-decoration:none; font-weight:600; cursor:pointer;">Resend code</button>
        </div>
      </form>

      <!-- Step 3: Set a new password only after code verification -->
      <form class="auth-form" id="step3-form" style="display:none;" onsubmit="handleReset(event)">
        <div class="form-group" style="margin-bottom:14px;">
          <label for="new-password" style="font-size:0.85rem; font-weight:600;">New Password</label>
          <input type="password" id="new-password" placeholder="Create new password" required minlength="8" maxlength="72" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,72}" title="Use at least 8 characters with uppercase and lowercase letters and a number." style="width:100%; padding:10px 14px; font-size:0.95rem; border-radius:8px;">
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label for="confirm-password" style="font-size:0.85rem; font-weight:600;">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm new password" required minlength="8" maxlength="72" style="width:100%; padding:10px 14px; font-size:0.95rem; border-radius:8px;">
        </div>

        <button type="submit" id="btn-reset" class="btn btn-primary" style="width:100%; padding:11px; font-size:0.95rem; font-weight:600; border-radius:8px; margin-bottom:14px;">Reset Password</button>

        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
          <a href="javascript:void(0)" onclick="backToStep1()" style="color:var(--text-muted); text-decoration:none;">&larr; Change email</a>
        </div>
      </form>

    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    let activeEmail = '';
    let resetAuthorizationToken = '';
    let resendTimer = null;

    function showStatus(message, isError = false) {
      const statusBox = document.getElementById('status-msg');
      statusBox.style.display = 'block';
      statusBox.style.background = isError ? '#fee2e2' : '#dbeafe';
      statusBox.style.color = isError ? '#b91c1c' : '#1e40af';
      statusBox.textContent = message;
    }

    function backToStep1() {
      resetAuthorizationToken = '';
      if (resendTimer) clearInterval(resendTimer);
      resendTimer = null;
      document.getElementById('step1-form').style.display = 'block';
      document.getElementById('step2-form').style.display = 'none';
      document.getElementById('step3-form').style.display = 'none';
      document.getElementById('page-subtitle').textContent = "Forgot your password? Enter your email address, and we'll send you a verification code to reset it.";
      document.getElementById('status-msg').style.display = 'none';
      document.getElementById('verification-code').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-password').value = '';
      const resendButton = document.getElementById('btn-resend-code');
      resendButton.disabled = false;
      resendButton.textContent = 'Resend code';
    }

    function startResendCooldown() {
      const button = document.getElementById('btn-resend-code');
      if (resendTimer) clearInterval(resendTimer);
      let secondsLeft = 60;
      button.disabled = true;
      button.textContent = `Resend code (${secondsLeft}s)`;
      resendTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) {
          clearInterval(resendTimer);
          resendTimer = null;
          button.disabled = false;
          button.textContent = 'Resend code';
          return;
        }
        button.textContent = `Resend code (${secondsLeft}s)`;
      }, 1000);
    }

    async function handleSendCode(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;
      await requestResetCode(email, document.getElementById('btn-continue'));
    }

    async function requestResetCode(email, button) {
      button.disabled = true;
      const originalText = button.textContent;
      button.textContent = 'Sending...';
      let cooldownStarted = false;
      try {
        await API.auth.sendPasswordResetCode(email);
        activeEmail = email;
        resetAuthorizationToken = '';
        document.getElementById('verification-code').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
        showStatus('If this address belongs to an account with a local password, a code will arrive when email delivery is available. Google-only accounts should use Google Sign-In.');
        document.getElementById('step1-form').style.display = 'none';
        document.getElementById('step2-form').style.display = 'block';
        document.getElementById('step3-form').style.display = 'none';
        document.getElementById('page-subtitle').textContent = 'Enter the 6-digit code from your email to continue.';
        startResendCooldown();
        cooldownStarted = true;
      } catch (err) {
        showStatus(err.message || 'Could not request password recovery.', true);
        if (button.id === 'btn-resend-code') {
          startResendCooldown();
          cooldownStarted = true;
        }
      } finally {
        if (button.id === 'btn-continue' || !cooldownStarted) {
          button.disabled = false;
          button.textContent = originalText;
        }
      }
    }

    async function resendCode() {
      await requestResetCode(activeEmail, document.getElementById('btn-resend-code'));
    }

    async function handleVerifyCode(e) {
      e.preventDefault();
      const code = document.getElementById('verification-code').value.trim();
      const button = document.getElementById('btn-verify-code');
      if (!/^[0-9]{6}$/.test(code)) {
        showStatus('Enter the 6-digit code from your email.', true);
        return;
      }

      button.disabled = true;
      button.textContent = 'Verifying...';
      try {
        const result = await API.auth.verifyResetCode(activeEmail, code);
        if (!result.resetToken) throw new Error('Verification could not be completed. Request a new code.');
        resetAuthorizationToken = result.resetToken;
        if (resendTimer) clearInterval(resendTimer);
        resendTimer = null;
        document.getElementById('step2-form').style.display = 'none';
        document.getElementById('step3-form').style.display = 'block';
        document.getElementById('page-subtitle').textContent = 'Choose a new password for your account.';
        showStatus('Code verified. You can now choose a new password.');
      } catch (err) {
        showStatus(err.message || 'The code is invalid or expired.', true);
      } finally {
        button.disabled = false;
        button.textContent = 'Verify Code';
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const button = document.getElementById('btn-reset');
      if (!resetAuthorizationToken) {
        showStatus('Verify your emailed code before setting a new password.', true);
        return;
      }
      if (newPassword !== confirmPassword) {
        showStatus('Passwords do not match.', true);
        return;
      }
      if (newPassword.length < 8 || newPassword.length > 72
          || new TextEncoder().encode(newPassword).length > 72
          || !/[a-z]/.test(newPassword) || !/[A-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
        showStatus('Use at least 8 characters with uppercase and lowercase letters and a number (maximum 72 UTF-8 bytes).', true);
        return;
      }

      button.disabled = true;
      button.textContent = 'Resetting...';
      try {
        await API.auth.resetPassword(resetAuthorizationToken, newPassword);
        resetAuthorizationToken = '';
        showStatus('Password reset successfully. You can now sign in.');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (err) {
        showStatus(err.message || 'Failed to reset password.', true);
      } finally {
        button.disabled = false;
        button.textContent = 'Reset Password';
      }
    }
    updateThemeIcon();
  </script>
</body>
</html>
