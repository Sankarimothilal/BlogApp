<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSphere - Register</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Top Navbar matching mockup -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
        BlogSphere
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
      </ul>
      <div>
        <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme"></button>
      </div>
    </div>
  </header>

  <!-- Register Card Form (Screen 3 Mockup) -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Register</h2>
      <div id="error-msg" style="color:#ef4444; font-size:0.85rem; margin-bottom:14px; display:none;"></div>

      <!-- Google Sign Up Option (Feature 2) -->
      <button type="button" class="btn btn-outline" onclick="handleGoogleRegister()" style="width:100%; padding:10px; font-size:0.92rem; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24Z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
        </svg>
        Sign up with Google
      </button>

      <div style="display:flex; align-items:center; margin:16px 0; color:var(--text-subtle); font-size:0.8rem;">
        <span style="flex:1; border-bottom:1px solid var(--border-color);"></span>
        <span style="padding:0 10px;">or register with email</span>
        <span style="flex:1; border-bottom:1px solid var(--border-color);"></span>
      </div>

      <form class="auth-form" id="register-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <input type="password" id="password" placeholder="Create a password" required minlength="6">
            <span class="input-toggle-icon" onclick="togglePasswordVisibility('password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role">
            <option value="Reader" selected>Reader</option>
            <option value="Author">Author</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px; font-size:0.95rem; margin-top:8px;">Register</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconSpan) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        iconSpan.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
      } else {
        input.type = 'password';
        iconSpan.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }

    function handleGoogleRegister() {
      try {
        window.location.href = 'http://localhost:8080/oauth2/authorization/google';
      } catch (error) {
        const errorBox = document.getElementById('error-msg');
        errorBox.textContent = 'Unable to start Google sign-in. Please try again.';
        errorBox.style.display = 'block';
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const errBox = document.getElementById('error-msg');
      const submitBtn = e.currentTarget.querySelector('[type="submit"]');
      const originalText = submitBtn.textContent;
      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        await API.auth.register(fullName, email, password, role);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errBox.textContent = err.message || 'Registration failed';
        errBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    updateThemeIcon();
  </script>
</body>
</html>
